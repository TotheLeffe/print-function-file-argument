<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cambiste — spot FR 24,5 s</title>
<style>
  @font-face{
    font-family:'Outfit'; font-style:normal; font-weight:100 900; font-display:block;
    src:url('fonts/outfit-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  @font-face{
    font-family:'Outfit'; font-style:normal; font-weight:100 900; font-display:block;
    src:url('fonts/outfit-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  #stage{display:block;width:1080px;height:1080px}
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1080"></canvas>
<script src="engine/brand.js"></script>
<script>
/* =========================================================================
   CAMBISTE — spot commercial 24,5 s · 1080x1080 · 30 fps · 735 images
   Charte : actifs et couleurs extraits de la video de marque officielle
            (cf. brand/brand.js, genere par tools/extract_brand.py).
   Rendu deterministe : renderFrame(n) dessine integralement l'image n,
   sans dependance a l'horloge -> capture image par image reproductible.
   ========================================================================= */

/* Bornes des plans, en images. SOURCE UNIQUE : la table de montage SC et
   l'origine locale de chaque fonction de plan en derivent toutes les deux.
   Les avoir saisies deux fois avait laisse les plans demarrer avec leur
   animation deja terminee. */
const CUT = { s1: 0, s2: 105, s3: 165, s4: 255, s5: 390, s6: 585, s7: 660,
              end: 735 };
const W = 1080, H = 1080, FPS = 30, TOTAL = CUT.end;   // 24,5 s
const cv  = document.getElementById('stage');
const ctx = cv.getContext('2d');

/* ---- Palette de marque ------------------------------------------------- */
const C = {
  green : BRAND.color.green,   // #0AB064 — vert Cambiste, aplat signature
  mint  : '#E8F6EF',           // teinte claire du vert de marque — 3e fond
  forest: '#055731',           // vert de marque assombri a teinte constante :
                               // seul fond ou l'or est lisible (4,6:1)
  leaf  : '#7FD9AE',           // teinte moyenne — confettis
  gold  : '#F0B323',           // or — reserve aux etoiles
  gold2 : '#FFD166',           // or clair — nuance des etoiles
  blue  : BRAND.color.blue,    // #2361EA — bleu d'accent
  ink   : BRAND.color.ink,     // #0B0B0C — encre, pour les textes uniquement
  white : BRAND.color.white
};

/* Les fonds ne prennent que quatre valeurs, toutes blanc ou vert :
   blanc -> vert plein -> blanc -> vert pale -> blanc -> vert profond -> blanc.
   Les couleurs vives restent dans la typographie et les details. */

const M = 92, MAXW = W - M * 2;

/* ---- Utilitaires ------------------------------------------------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg   = (f, a, b) => clamp((f - a) / (b - a));
const eo    = x => 1 - Math.pow(1 - x, 3);
const eo4   = x => 1 - Math.pow(1 - x, 4);
const eio   = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const wipeE = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2)/2;   // volets
const back  = x => { const c1 = 1.9, c3 = c1 + 1;
                     return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };

function mul32(a){ return function(){
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};}

function alpha(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* ---- Typographie ------------------------------------------------------- */
function font(size, o = {}){
  ctx.font = `${o.w || 800} ${size}px Outfit, sans-serif`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = (o.tr || 0) + 'px';
}
function fit(t, maxW, start, o = {}){
  let s = start; font(s, o);
  while (ctx.measureText(t).width > maxW && s > 12){ s -= 1; font(s, o); }
  return s;
}
function widthOf(t, size, o){ font(size, o); return ctx.measureText(t).width; }

/** Ligne kinetique : masque qui monte + leger decalage vertical. */
function reveal(t, x, y, size, o, p, align = 'left'){
  if (p <= 0) return;
  const e = eo(p), asc = size * 1.02, desc = size * .30;
  const w = widthOf(t, size, o) + size * .3;
  const x0 = align === 'center' ? x - w/2 : x - size * .12;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y + desc - (asc + desc) * e, w, (asc + desc) * e);
  ctx.clip();
  ctx.globalAlpha = clamp(p * 1.6);
  ctx.textAlign = align;
  ctx.fillStyle = o.color || C.ink;
  font(size, o);
  ctx.fillText(t, x, y + (1 - e) * size * .22);
  ctx.restore();
}

/**
 * Ligne revelee MOT A MOT : chaque mot monte derriere son propre masque, avec
 * un decalage, et se pose avec un leger rebond. La ou un masque unique posait
 * la ligne d'un bloc, l'oeil suit ici la phrase se construire.
 *   l    : image courante dans le plan      a : image de depart du 1er mot
 *   step : decalage d'un mot au suivant     dur : duree de montee d'un mot
 */
function revealWords(t, x, y, size, o, l, a, step, dur, align = 'left'){
  const words = t.split(' ');
  font(size, o);
  const sp = ctx.measureText(' ').width;
  const w  = words.map(m => { font(size, o); return ctx.measureText(m).width; });
  const tot = w.reduce((s, v) => s + v, 0) + sp * (words.length - 1);
  let cx = align === 'center' ? x - tot / 2 : x;
  const asc = size * 1.10, desc = size * .32;
  for (let i = 0; i < words.length; i++){
    const p = seg(l, a + i * step, a + i * step + dur);
    if (p > 0){
      const em = eo(clamp(p * 1.3));          // le masque ouvre avant le mot
      const ey = back(eo(p));                 // atterrissage avec rebond
      ctx.save();
      ctx.beginPath();
      ctx.rect(cx - size * .1, y + desc - (asc + desc) * em,
               w[i] + size * .2, (asc + desc) * em);
      ctx.clip();
      ctx.globalAlpha = clamp(p * 2.2);
      ctx.textAlign = 'left';
      ctx.fillStyle = o.color || C.ink;
      font(size, o);
      ctx.fillText(words[i], cx, y + (1 - ey) * size * .30);
      ctx.restore();
    }
    cx += w[i] + sp;
  }
}

/** Texte secondaire : il monte de quelques pixels au lieu d'apparaitre sur place. */
function textRise(str, x, y, size, o, align, p, rise = 16){
  if (p <= 0) return;
  text(str, x, y + (1 - eo(p)) * rise, size, o, align, clamp(p * 1.4));
}

function text(str, x, y, size, o = {}, align = 'left', a = 1){
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = clamp(a);
  ctx.textAlign = align;
  ctx.fillStyle = o.color || C.ink;
  font(size, o);
  ctx.fillText(str, x, y);
  ctx.restore();
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function bg(c){ ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }

/* =========================================================================
   LOGO CAMBISTE
   Logotype : masque alpha natif (494x85), teinte a la volee.
   Marque   : vectorielle — squircle + glyphe a symetrie centrale.
   ========================================================================= */
const LOCK = { wmRatio: 493/84, markRatio: 110/84, gap: 28/84, tagRatio: 35/84,
               tagDrop: 58/84 };

let WM = { black: null, white: null, ready: false };
const markPath = new Path2D(BRAND.mark.lobe);

function tint(img, color){
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = color;
  x.fillRect(0, 0, c.width, c.height);
  return c;
}

/** Contour du carre de marque : superellipse (squircle), pas un rayon simple. */
function squircle(w, h, R, n){
  const N = 16, pts = [];
  const corner = (t) => [R - R * Math.pow(Math.cos(t), 2/n),
                         R - R * Math.pow(Math.sin(t), 2/n)];
  ctx.beginPath();
  for (let i = 0; i <= N; i++){                       // haut-gauche
    const [x, y] = corner(i / N * Math.PI/2);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let i = 0; i <= N; i++){                       // haut-droite
    const [x, y] = corner(Math.PI/2 - i / N * Math.PI/2);
    ctx.lineTo(w - x, y);
  }
  for (let i = 0; i <= N; i++){                       // bas-droite
    const [x, y] = corner(i / N * Math.PI/2);
    ctx.lineTo(w - x, h - y);
  }
  for (let i = 0; i <= N; i++){                       // bas-gauche
    const [x, y] = corner(Math.PI/2 - i / N * Math.PI/2);
    ctx.lineTo(x, h - y);
  }
  ctx.closePath();
}

/** Marque seule, hauteur h, coin superieur gauche en (x, y). */
function drawMark(x, y, h){
  const B = BRAND.mark;
  const s = h / B.vbh;                       // viewbox -> pixels
  const Rv = B.R * B.vbw / B.w;              // rayon exprime en unites viewbox
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = C.green;
  squircle(B.vbw, B.vbh, Rv, B.n);
  ctx.fill();
  ctx.fillStyle = C.white;
  ctx.fill(markPath);                        // lobe superieur
  ctx.save();                                // lobe inferieur = rotation 180°
  ctx.translate(B.cx, B.cy); ctx.rotate(Math.PI); ctx.translate(-B.cx, -B.cy);
  ctx.fill(markPath);
  ctx.restore();
  ctx.restore();
}

/**
 * Verrouillage logotype + marque, centre sur (cx, cy), hauteur de capitale h.
 * pw / pm : avancement d'apparition du logotype et de la marque (0..1).
 */
function drawLockup(cx, cy, h, dark, pw = 1, pm = 1, tagP = 0){
  const wmW  = LOCK.wmRatio * h;
  const mkW  = LOCK.markRatio * h;
  const tot  = wmW + LOCK.gap * h + mkW;
  const x0   = cx - tot / 2, y0 = cy - h / 2;

  if (pw > 0 && WM.ready){
    ctx.save();
    // opacite pleine des l'entree : le logotype s'ecrit, il ne se fond pas
    ctx.globalAlpha = clamp(pw * 6);
    // le logotype se devoile de la gauche vers la droite
    ctx.beginPath(); ctx.rect(x0 - 4, y0 - h, wmW * eo(pw) + 4, h * 3); ctx.clip();
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(dark ? WM.white : WM.black, x0, y0, wmW, h);
    ctx.restore();
  }
  if (pm > 0){
    const e = back(eo(pm));
    ctx.save();
    ctx.globalAlpha = clamp(pm * 2);
    ctx.translate(x0 + wmW + LOCK.gap * h + mkW/2, cy);
    ctx.rotate((1 - e) * -0.45);
    ctx.scale(.4 + .6 * e, .4 + .6 * e);
    drawMark(-mkW/2, -h/2, h);
    ctx.restore();
  }
  if (tagP > 0){
    text(BRAND.tagline, cx, cy + h/2 + LOCK.tagDrop * h + LOCK.tagRatio * h,
         LOCK.tagRatio * h * 1.34,
         { w: 700, tr: .5, color: dark ? C.white : C.ink }, 'center', eo(tagP));
  }
}

/* ---- Confettis (deterministes) ----------------------------------------- */
const CONF = (() => {
  const r = mul32(20260824), out = [];
  const cols = [C.green, C.blue, C.leaf, C.green, C.blue, C.leaf, C.green];
  for (let i = 0; i < 108; i++)
    {
      const sh = (r()*4)|0;                       // 1 et 2 = formes etoilees
      const star = sh === 1 || sh === 2;
      out.push({ a: r()*Math.PI*2, v: 380 + r()*900, s: 11 + r()*26,
                 col: star ? (r() > .5 ? C.gold : C.gold2)
                           : cols[(r()*cols.length)|0],
                 sh, rot: r()*Math.PI*2, rv: (r()-.5)*9, dl: r()*.16 });
    }
  return out;
})();

/* =========================================================================
   ETOILES DOREES — motif recurrent du film.
   Elles ponctuent chaque temps fort : la biffure, le renversement, la pose
   du logo, le passage du jeton, chaque controle valide, et la signature.
   Chaque etoile eclot avec un rebond puis scintille doucement.
   ========================================================================= */
function stars(list, l){
  for (const p of list){
    const q = seg(l, p.d, p.d + 9);
    if (q <= 0) continue;
    const e = Math.max(back(eo(q)), 0);
    const tw = 1 + .12 * Math.sin((l - p.d) * .25);   // scintillement
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot || 0);
    ctx.scale(e * tw, e * tw);
    ctx.globalAlpha = clamp(q * 2.5) * (p.a || 1);
    ctx.fillStyle = p.col || C.gold;
    sparkle(p.s);
    ctx.fill();
    ctx.restore();
  }
}

const G = C.gold, G2 = '#FFD166';

/* Scene 1 — elles giclent de la biffure, dans les blancs a droite du texte. */
const STAR1 = [
  { x: 884, y: 232, s: 26, d: 56, rot: .3, col: G  },
  { x: 978, y: 322, s: 17, d: 59, rot: .9, col: G2 },
  { x: 692, y: 268, s: 20, d: 58, rot: .5, col: G2 },
  { x: 214, y: 892, s: 23, d: 57, rot: .4, col: G  },
  { x: 376, y: 940, s: 16, d: 60, rot: .1, col: G2 },
  { x: 908, y: 878, s: 25, d: 59, rot: .7, col: G  }
];

/* Scene 2 — pluie d'etoiles, cantonnee aux bandes haute et basse. */
const SPARK = (() => {
  const r = mul32(77021), out = [];
  for (let i = 0; i < 18; i++)
    out.push({ x: 105 + r() * (W - 210),
               y: (i % 2 ? 700 + r() * 190 : 168 + r() * 165),
               s: 18 + r() * 24,
               col: r() > .45 ? G : G2,
               d: 11 + r() * 18,
               rot: r() * Math.PI });
  return out;
})();

/* Scene 3 — elles saluent la pose de la marque. */
const STAR3 = [
  { x: 206, y: 302, s: 25, d: 28, rot: .2,  col: G  },
  { x: 884, y: 276, s: 19, d: 31, rot: .8,  col: G2 },
  { x: 128, y: 648, s: 17, d: 35, rot: .5,  col: G2 },
  { x: 958, y: 606, s: 23, d: 33, rot: .1,  col: G  },
  { x: 548, y: 214, s: 15, d: 37, rot: .6,  col: G  }
];

/* Scene 4 — deux en fond, plus une qui eclate quand le jeton
   traverse la carte Cambiste (image 54 de la scene). */
const STAR4 = [
  { x: 948, y: 252, s: 22, d: 26, rot: .3, col: G2 },
  { x: 126, y: 716, s: 18, d: 64, rot: .7, col: G  },
  { x: 986, y: 736, s: 20, d: 72, rot: .2, col: G2 },
  { x: 540, y: 424, s: 28, d: 73, rot: .4, col: G  }
];

/* Scene 6 — le plan le plus court, quatre etoiles suffisent. */
const STAR6 = [
  { x: 174, y: 304, s: 26, d: 12, rot: .2, col: G  },
  { x: 902, y: 322, s: 20, d: 15, rot: .8, col: G2 },
  { x: 212, y: 802, s: 23, d: 18, rot: .5, col: G2 },
  { x: 884, y: 776, s: 18, d: 16, rot: .3, col: G  },
  { x: 540, y: 902, s: 22, d: 20, rot: .6, col: G2 },
  { x: 692, y: 236, s: 17, d: 14, rot: .2, col: G  }
];

function sparkle(s){
  const k = s * .23;
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.quadraticCurveTo(k, -k, s, 0);
  ctx.quadraticCurveTo(k, k, 0, s);
  ctx.quadraticCurveTo(-k, k, -s, 0);
  ctx.quadraticCurveTo(-k, -k, 0, -s);
  ctx.closePath();
}
function star6(s){
  ctx.beginPath();
  for (let i = 0; i < 12; i++){
    const rr = i % 2 ? s * .46 : s, an = i/12 * Math.PI*2 - Math.PI/2;
    ctx[i ? 'lineTo' : 'moveTo'](Math.cos(an)*rr, Math.sin(an)*rr);
  }
  ctx.closePath();
}
function burst(cx, cy, tau){
  if (tau <= 0) return;
  for (const p of CONF){
    const t = tau - p.dl;
    if (t <= 0) continue;
    const s = p.v * (1 - Math.exp(-2.7 * t)) / 2.7;
    const x = cx + Math.cos(p.a) * s;
    const y = cy + Math.sin(p.a) * s + 560 * t * t;
    if (y > H + 90 || x < -90 || x > W + 90) continue;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot + p.rv * t);
    ctx.globalAlpha = clamp(t * 7);
    ctx.fillStyle = p.col;
    const sz = p.s * clamp(t * 6);
    if      (p.sh === 0){ ctx.beginPath(); ctx.arc(0, 0, sz*.6, 0, 7); ctx.fill(); }
    else if (p.sh === 1){ sparkle(sz); ctx.fill(); }
    else if (p.sh === 2){ star6(sz*.9); ctx.fill(); }
    else                { roundRect(-sz*.5, -sz*.5, sz, sz, sz*.28); ctx.fill(); }
    ctx.restore();
  }
}

/* =========================================================================
   SCENES
   ========================================================================= */

/* --- 1. Le mur (0.00 – 2.00 s) ------------------------------------------ */
const S1A = 'LE TRANSFERT', S1B = 'INTERNATIONAL', S1C = "S'ARRÊTE ICI.";
const S1Y = 510, S1LH = 1.14;                 // pied de la 1re ligne, interligne
const s1Size = () => fit(S1B, MAXW, 130, { w: 800, tr: -3 });
const s1Base = () => S1Y + 2 * s1Size() * S1LH;   // pied de la ligne biffee

function s1(f, opt = {}){
  bg(C.white);
  text('OPÉRATEURS MOBILE MONEY', M, 340, 27,
       { w: 700, tr: 5.5, color: C.green }, 'left', eo(seg(f, 2, 14)));
  const s = s1Size(), o = { w: 800, tr: -3, color: C.ink };
  revealWords(S1A, M, S1Y,                s, o, f,  6, 6, 17);
  revealWords(S1B, M, S1Y + s * S1LH,     s, o, f, 18, 6, 17);
  revealWords(S1C, M, S1Y + 2 * s * S1LH, s, o, f, 30, 6, 17);

  if (!opt.noBar){
    const p = eo(seg(f, 54, 70));
    if (p > 0){
      const bw = widthOf(S1C, s, { w: 800, tr: -3 });
      ctx.fillStyle = C.green;
      // centree sur la hauteur de capitale (~0.35 x corps au-dessus du pied)
      ctx.fillRect(M - 10, s1Base() - s * .42, (bw + 20) * p, s * .14);
    }
    stars(STAR1, f);
  }
}

/* --- 2. Le renversement (2.00 – 3.60 s) --------------------------------- */
function barShape(p){                    // la barre verte engloutit le cadre
  const s  = s1Size();
  const bw = widthOf(S1C, s, { w: 800, tr: -3 }) + 20;
  const h0 = s * .14, y0 = s1Base() - s * .42, cy = y0 + h0/2;
  const w = bw + (W + 20 - bw) * p, h = h0 + (H + 20 - h0) * p;
  ctx.beginPath();
  ctx.rect((M - 10) * (1 - p), cy - h/2 - (cy - H/2) * p, w, h);
}

function s2(f){
  bg(C.green);
  const l = f - CUT.s2;
  const pop = (str, y, size, p) => {
    if (p <= 0) return;
    const e = back(eo(p));
    ctx.save();
    ctx.translate(W/2, y);
    ctx.scale(.86 + .14*e, .86 + .14*e);
    text(str, 0, 0, size, { w: 800, tr: -3, color: C.ink }, 'center', clamp(p*2));
    ctx.restore();
  };
  stars(SPARK, l);
  const big = fit('MAINTENANT.', MAXW, 136, { w: 800, tr: -4 });
  pop('PLUS', 452, fit('PLUS', MAXW, 122, { w: 800, tr: -2 }), seg(l, 12, 25));
  pop('MAINTENANT.', 452 + big * 1.02, big, seg(l, 18, 32));
}

/* --- 3. La marque (3.60 – 5.80 s) --------------------------------------- */
function s3(f){
  bg(C.white);
  const l = f - CUT.s3;
  stars(STAR3, l);
  drawLockup(W/2, 470, 94, false, seg(l, 12, 34), seg(l, 24, 42), seg(l, 34, 48));

  const pr = eo(seg(l, 36, 50));
  if (pr > 0){
    ctx.fillStyle = C.green;
    ctx.fillRect(W/2 - (MAXW - 150)/2 * pr, 690, (MAXW - 150) * pr, 8);
  }
  textRise('Le paiement international,', W/2, 774, 38,
           { w: 500, color: alpha(C.ink, .8) }, 'center', seg(l, 40, 54));
  textRise('directement depuis le wallet Mobile Money.', W/2, 826, 38,
           { w: 500, color: alpha(C.ink, .8) }, 'center', seg(l, 45, 59));
}

/* --- 4. Le flux (5.80 – 8.60 s) ----------------------------------------- */
const NODES = [
  { cx: 220, t: 'WALLET',       s: 'Mobile Money'      },
  { cx: 540, t: 'CAMBISTE',     s: 'Orchestration API' },
  { cx: 860, t: 'BÉNÉFICIAIRE', s: "À l'international" }
];
const NY = 556, NW = 262, NH = 158;

function s4(f){
  bg(C.mint);                               // teinte claire du vert de marque
  const l = f - CUT.s4;
  stars(STAR4, l);
  const s = fit("UN SEUL POINT D'INTÉGRATION.", MAXW, 66, { w: 800, tr: -1.5 });
  revealWords("UN SEUL POINT D'INTÉGRATION.", M, 330, s,
              { w: 800, tr: -1.5, color: C.ink }, l, 12, 5, 16);

  const pr = eo(seg(l, 22, 42));
  if (pr > 0){
    ctx.save();
    ctx.strokeStyle = alpha(C.green, .45);
    ctx.lineWidth = 4; ctx.setLineDash([2, 16]); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(NODES[0].cx, NY);
    ctx.lineTo(NODES[0].cx + (NODES[2].cx - NODES[0].cx) * pr, NY);
    ctx.stroke();
    ctx.restore();
  }

  // le jeton passe DERRIERE les cartes : il traverse reellement Cambiste
  const pt = seg(l, 50, 96);          // trajet ralenti : 1,53 s
  if (pt > 0 && pt < 1){
    const x = NODES[0].cx + (NODES[2].cx - NODES[0].cx) * eio(pt);
    ctx.save();
    ctx.globalAlpha = .22; ctx.fillStyle = C.blue;
    ctx.beginPath(); ctx.arc(x, NY, 46, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(x, NY, 21, 0, 7); ctx.fill();
    ctx.restore();
  }

  NODES.forEach((n, i) => {
    const p = seg(l, 26 + i*9, 44 + i*9);
    if (p <= 0) return;
    const e = back(eo(p)), mid = i === 1;
    // la carte Cambiste tressaille quand le jeton la traverse (image 54)
    const bump = mid ? 1 + .07 * Math.exp(-Math.pow((l - 73) / 5, 2)) : 1;
    ctx.save();
    ctx.translate(n.cx, NY);
    ctx.scale((.82 + .18*e) * bump, (.82 + .18*e) * bump);
    ctx.globalAlpha = clamp(p * 2);
    roundRect(-NW/2, -NH/2, NW, NH, 32);
    // fond plein dans les deux cas : les cartes masquent le jeton au passage
    ctx.fillStyle = mid ? C.green : C.white;
    ctx.fill();
    text(n.t, 0, -4, mid ? 30 : 28,
         { w: 800, tr: .4, color: mid ? C.white : C.ink }, 'center');
    text(n.s, 0, 38, 21,
         { w: 500, color: mid ? alpha(C.white, .85) : alpha(C.ink, .5) }, 'center');
    ctx.restore();
  });

  textRise('Aucune infrastructure blockchain à opérer.', M, 812, 32,
           { w: 600, color: alpha(C.ink, .82) }, 'left', seg(l, 68, 84));
  textRise("Aucun compte de préfinancement à l'étranger.", M, 862, 32,
           { w: 600, color: alpha(C.ink, .82) }, 'left', seg(l, 74, 90));
}

/* --- 5. La conformite (8.60 – 12.00 s) ---------------------------------- */
const CHECKS = ['KYC & origine des fonds', 'Screening sanctions',
                'Travel Rule', 'Monitoring & réconciliation'];

/* Une etoile doree salue chaque controle valide, calee sur sa coche. */
const STAR5 = CHECKS.map((_, i) => ({
  x: i % 2 ? 878 : 812, y: 500 + i * 102,
  s: i % 2 ? 16 : 21, col: i % 2 ? G2 : G,
  d: 76 + i * 20 + 8, rot: .2 + i * .6
}));

function s5(f){
  bg(C.white);
  const l = f - CUT.s5;
  const s = fit("N'EST PAS UNE OPTION.", MAXW, 74, { w: 800, tr: -1.8 });
  revealWords('LA CONFORMITÉ',         M, 292,            s,
              { w: 800, tr: -1.8, color: C.ink },   l, 12, 6, 16);
  revealWords("N'EST PAS UNE OPTION.", M, 292 + s * 1.06, s,
              { w: 800, tr: -1.8, color: C.green }, l, 22, 5, 15);

  CHECKS.forEach((label, i) => {
    // le titre tient seul les 2,5 premieres secondes ; les controles
    // s'egrenent ensuite sur 4 s, un toutes les 0,67 s
    const a0 = 76 + i * 20;
    const pr = seg(l, a0, a0 + 14), pc = seg(l, a0 + 5, a0 + 17);
    if (pr <= 0) return;
    const y = 522 + i * 102;
    ctx.save();
    ctx.globalAlpha = clamp(pr * 2);
    ctx.translate((1 - eo(pr)) * -46, 0);

    const e = Math.max(back(eo(pc)), 0);
    ctx.save();
    ctx.translate(M + 34, y - 12);
    ctx.scale(.4 + .6*e, .4 + .6*e);
    ctx.globalAlpha = clamp(pc * 3) * clamp(pr * 2);
    ctx.fillStyle = C.green;
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.fill();
    ctx.strokeStyle = C.white;
    ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-12, 1); ctx.lineTo(-3, 11); ctx.lineTo(13, -10);
    ctx.stroke();
    ctx.restore();

    if (pc > 0 && pc < 1){
      ctx.save();
      ctx.globalAlpha = (1 - pc) * .5;
      ctx.strokeStyle = C.green; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(M + 34, y - 12, 30 + pc * 40, 0, 7); ctx.stroke();
      ctx.restore();
    }
    text(label, M + 88, y, 40, { w: 700, color: C.ink }, 'left');
    ctx.restore();
  });

  stars(STAR5, l);
  textRise('Contrôles intégrés au flux. À chaque transaction.', M, 946, 29,
           { w: 500, color: alpha(C.ink, .6) }, 'left', seg(l, 150, 164));
}

/* --- 6. Cote client (12.00 – 13.30 s) ----------------------------------- */
function s6(f){
  // Fond vert profond : sur le vert vif, l'or plafonne a 2,6:1 et ne se lit
  // pas. Assombri a teinte constante, il porte l'or a 4,6:1.
  bg(C.forest);
  const l = f - CUT.s6;
  stars(STAR6, l);
  const s = fit('UN SIMPLE TRANSFERT.', MAXW, 112, { w: 800, tr: -3 });
  revealWords('CÔTÉ CLIENT,', W/2, 468,
              fit('CÔTÉ CLIENT,', MAXW, 76, { w: 600, tr: -1 }),
              { w: 600, tr: -1, color: alpha(C.white, .72) }, l, 12, 6, 16, 'center');
  revealWords('UN SIMPLE TRANSFERT.', W/2, 468 + s * 1.02, s,
              { w: 800, tr: -3, color: C.gold }, l, 16, 6, 16, 'center');

  // filet dore : la chute se souligne une fois posee
  const pu = eo(seg(l, 46, 60));
  if (pu > 0){
    const wl = widthOf('UN SIMPLE TRANSFERT.', s, { w: 800, tr: -3 });
    ctx.fillStyle = C.gold;
    ctx.fillRect(W/2 - wl/2, 468 + s * 1.02 + s * .26, wl * pu, 7);
  }
}

/* --- 7. Signature (13.30 – 15.00 s) ------------------------------------- */
function s7(f){
  bg(C.white);
  const l = f - CUT.s7;
  const g = ctx.createRadialGradient(W/2, 500, 40, W/2, 500, 660);
  g.addColorStop(0, alpha(C.green, .16));
  g.addColorStop(1, alpha(C.green, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  burst(W/2, 492, (l - 4) / FPS);
  drawLockup(W/2, 512, 92, false, seg(l, 12, 30), seg(l, 19, 35), seg(l, 28, 44));
}

/* =========================================================================
   MONTAGE
   ========================================================================= */
/* Duree de chaque plan calee sur le temps de lecture, pas sur le temps
   d'animation : aucun plan strategique ne se coupe avant que sa composition
   soit complete depuis ~1 s. Les deux plans explicatifs (le flux et la
   conformite) sont les plus longs — 4,5 s et 6,5 s. */
const SC = [
  { start: CUT.s1, end: CUT.s2 - 1, draw: s1, tin:  0 },            // 3,5 s
  { start: CUT.s2, end: CUT.s3 - 1, draw: s2, tin: 18,              // 2,0 s
    prevOpt: { noBar: true }, wipe: barShape },
  { start: CUT.s3, end: CUT.s4 - 1, draw: s3, tin: 20,              // 3,0 s
    wipe: p => { ctx.beginPath(); ctx.rect(0, 0, W, H * p); } },
  { start: CUT.s4, end: CUT.s5 - 1, draw: s4, tin: 20,              // 4,5 s
    wipe: p => { ctx.beginPath(); ctx.rect(W * (1 - p), 0, W * p, H); } },
  { start: CUT.s5, end: CUT.s6 - 1, draw: s5, tin: 20,              // 6,5 s
    wipe: p => { ctx.beginPath(); ctx.rect(0, H * (1 - p), W, H * p); } },
  { start: CUT.s6, end: CUT.s7 - 1, draw: s6, tin: 15,              // 2,5 s
    wipe: p => { ctx.beginPath(); ctx.rect(0, 0, W * p, H); } },
  { start: CUT.s7, end: CUT.end - 1, draw: s7, tin: 16,             // 2,5 s
    wipe: p => { ctx.beginPath(); ctx.arc(W/2, 492, 800 * p, 0, 7); } }
];

/* Garde-fou : chaque plan doit demarrer son animation a son image d'ouverture. */
SC.forEach((sc, i) => {
  if (i && sc.start !== SC[i - 1].end + 1)
    console.error('plan', i + 1, 'discontinu', SC[i - 1].end, sc.start);
});

function sceneAt(f){
  for (let i = SC.length - 1; i >= 0; i--) if (f >= SC[i].start) return i;
  return 0;
}

function renderFrame(f){
  f = Math.max(0, Math.min(TOTAL - 1, f | 0));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  bg(C.white);
  const i = sceneAt(f), sc = SC[i];
  if (i > 0 && f < sc.start + sc.tin){
    const prev = SC[i - 1];
    prev.draw(prev.end, sc.prevOpt || {});
    ctx.save();
    sc.wipe(wipeE(seg(f, sc.start, sc.start + sc.tin)));
    ctx.clip();
    sc.draw(f);
    ctx.restore();
  } else {
    sc.draw(f);
  }
}

window.renderFrame = renderFrame;
window.TOTAL = TOTAL;
window.ready = false;

const wmImg = new Image();
wmImg.onload = () => {
  WM.black = tint(wmImg, C.ink);
  WM.white = tint(wmImg, C.white);
  WM.ready = true;
  document.fonts.load('800 100px Outfit')
    .then(() => document.fonts.load('500 38px Outfit'))
    .then(() => document.fonts.load('700 40px Outfit'))
    .then(() => document.fonts.ready)
    .then(() => { window.ready = true; renderFrame(0); });
};
wmImg.src = BRAND.wordmark;

window.play = function(){
  const t0 = performance.now();
  (function loop(){
    renderFrame(Math.floor((performance.now() - t0) / 1000 * FPS) % TOTAL);
    requestAnimationFrame(loop);
  })();
};
</script>
