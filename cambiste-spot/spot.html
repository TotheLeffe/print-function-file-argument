<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cambiste — spot</title>
<style>
  @font-face{
    font-family:'Outfit'; font-style:normal; font-weight:100 900; font-display:block;
    src:url('fonts/outfit-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  @font-face{
    font-family:'Outfit'; font-style:normal; font-weight:100 900; font-display:block;
    src:url('fonts/outfit-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  html,body{margin:0;padding:0;background:#111;overflow:hidden}
  #stage{display:block;width:1080px;height:1080px}
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1080"></canvas>
<script src="engine/brand.js"></script>
<script src="engine/engine.js"></script>
<script>
/* Charge le spot demande : spot.html?spot=01 (defaut 01).
   Chaque spot ne decrit que son contenu ; le moteur tient la charte. */
(function () {
  const id = (new URLSearchParams(location.search).get('spot') || '01')
             .replace(/[^0-9a-z\-]/gi, '');
  const s = document.createElement('script');
  s.src = 'spots/' + id + '.js';
  s.onload = function () {
    document.title = 'Cambiste — ' + (window.SPOT.name || id);
    CAMBISTE.boot(document.getElementById('stage'), window.SPOT);
  };
  s.onerror = function () {
    document.body.insertAdjacentHTML('beforeend',
      '<p style="color:#fff;font:16px monospace">spot introuvable : ' + id + '</p>');
  };
  document.head.appendChild(s);

  /* Lecture temps reel dans un navigateur ; la capture n'en depend pas. */
  window.play = function () {
    const t0 = performance.now();
    (function loop(){
      window.renderFrame(Math.floor((performance.now() - t0) / 1000 * 30) % window.TOTAL);
      requestAnimationFrame(loop);
    })();
  };
})();
</script>
</body>
</html>
